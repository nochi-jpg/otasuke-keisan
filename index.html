<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おたすけ計算</title>
<style>
:root{
  --f:"UD デジタル 教科書体 NK-R","UD デジタル 教科書体 N-R","UD Digi Kyokasho NK-R","UD Digi Kyokasho N-R","BIZ UDPGothic","Meiryo",sans-serif;
  --fb:"UD デジタル 教科書体 NK-B","UD デジタル 教科書体 N-B","UD Digi Kyokasho NK-B","UD Digi Kyokasho N-B","BIZ UDPGothic","Meiryo",sans-serif;
  --ink:#1c2233; --kid:#183a8c; --carry:#e8590c; --borrow:#1971c2;
  --grid:#3aa0d0; --gridL:#8ccbe8; --navy:#24314d; --cell:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#e9edf2;touch-action:manipulation;overscroll-behavior:none}
body{font-family:var(--f);color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:var(--fb);cursor:pointer}
ruby rt{font-size:.36em;letter-spacing:0;font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;
  background:#fdfcf8;box-shadow:0 0 40px rgba(0,0,0,.12)}

/* ---- ヘッダー ---- */
#top{position:absolute;left:0;right:0;top:0;height:100px}
.ttl{position:absolute;left:44px;top:10px;font:700 60px/1.3 var(--fb);letter-spacing:2px;color:#111}
.ttl rt{font-size:.3em}
.hbtns{position:absolute;right:20px;top:22px;display:flex;gap:14px}
.hbtns .gb{width:190px}

/* ---- つやつやボタン（まなびバトル風） ---- */
.gb{position:relative;height:64px;border-radius:32px;border:3px solid var(--navy);color:#fff;font-size:28px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:1px;
  text-shadow:0 2px 0 rgba(0,0,0,.28);box-shadow:0 5px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(0,0,0,.12);
  transition:transform .07s,box-shadow .07s,filter .1s}
.gb::before{content:"";position:absolute;left:16px;top:9px;width:10px;height:10px;border-radius:50%;background:#fff;opacity:.95}
.gb::after{content:"";position:absolute;left:30px;right:30px;top:6px;height:12px;border-radius:8px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.gb:hover:not(:disabled){filter:brightness(1.08)}
.gb:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.5)}
.gb:disabled{filter:grayscale(.85) brightness(1.05);opacity:.45;cursor:default}
.gb svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));flex:none}
.gb svg.gear circle{stroke-width:4}
.gb svg.gear path{stroke-width:4.5;stroke-linecap:butt}
.nb{white-space:nowrap}
.g-cyan{background:linear-gradient(180deg,#6fdcf7,#1aa6dc 55%,#0b86c0)}
.g-green{background:linear-gradient(180deg,#8be38a,#2fb85a 55%,#1d9446)}
.g-orange{background:linear-gradient(180deg,#ffc56b,#f7931e 55%,#dd7406)}
.g-navy{background:linear-gradient(180deg,#8a7cf0,#5b48d6 55%,#4331b5)}
.g-pink{background:linear-gradient(180deg,#ff9fc8,#ec5c9b 55%,#cf3f7f)}
.g-gray{background:linear-gradient(180deg,#b9c3d1,#7f8ba0 55%,#66728a)}
.g-pearl{background:linear-gradient(180deg,#ffffff,#eef2f8 60%,#d9e1ec);color:var(--navy);text-shadow:none}
.g-pearl::after{display:none}
.gb.sm{height:52px;font-size:24px;border-radius:26px;box-shadow:0 4px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.55)}
.gb.sm::before{left:13px;top:7px;width:8px;height:8px}

/* ---- ノート（12行） ---- */
#note{position:absolute;left:52px;top:116px;width:1008px;height:728px}
#note>*{position:absolute;left:0;top:0;width:1008px;height:728px}
#grid{overflow:visible}
#hlL,#markL,#boxL,#flyL{pointer-events:none}
#boxL{pointer-events:auto;width:0;height:0}
#shiki{width:56px!important;height:56px!important;display:flex;align-items:center;justify-content:center;font:700 34px var(--fb);padding-top:8px}
#shiki rt{font-size:.38em}
#lineL,#fxL{overflow:visible;pointer-events:none}

.mk{position:absolute;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;color:var(--ink)}
.mk.f{font-size:38px}
.mk.u{color:var(--kid)}
.mk.o{font-size:42px}
.mk.s{width:28px;height:28px;font-size:23px;font-weight:700;letter-spacing:-1px}
.mk.cy{color:var(--carry)}
.mk.s.bw{color:var(--borrow)}
.mk.s.sm{font-size:19px;width:26px}
.mk.x::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:3px;border-radius:2px;background:var(--borrow);transform:rotate(-58deg)}
.mk.g{opacity:0}
.mk.g.nw{animation:gone 2s ease forwards}
.mk.nw{animation:pop .5s cubic-bezier(.2,1.7,.45,1) both}
.mk.s.nw{animation:popS .6s cubic-bezier(.2,1.7,.45,1) both}
.mk.late{animation-delay:.55s}
.mk.x.nw::after{animation:slash .4s ease-out both}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes popS{0%{transform:scale(.2);opacity:0;text-shadow:0 0 0 #fff}50%{transform:scale(1.7);opacity:1}100%{transform:scale(1)}}
@keyframes slash{0%{transform:rotate(-58deg) scaleX(0)}100%{transform:rotate(-58deg) scaleX(1)}}
@keyframes gone{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1)}60%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.hl{position:absolute;background:rgba(255,226,0,.55);border-radius:12px 6px 14px 8px;mix-blend-mode:multiply;animation:swipe .4s ease-out both}
.hl.s{background:rgba(255,200,0,.45)}
@keyframes swipe{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}

.box{position:absolute;border:4px solid #ff3b3b;border-radius:6px;background:rgba(255,255,255,.35);cursor:pointer;
  animation:glow 1.3s ease-in-out infinite}
.box.shake{animation:shake .45s, glow 1.3s ease-in-out .45s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(255,59,59,.15),0 0 10px 2px rgba(255,59,59,.35)}50%{box-shadow:0 0 0 2px rgba(255,59,59,.35),0 0 22px 6px rgba(255,59,59,.55)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.bd{position:absolute;top:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--kid)}
.bd.f{font-size:38px;color:var(--ink)}
.caret{position:absolute;top:38px;width:24px;height:4px;background:#ff3b3b;border-radius:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fly{position:absolute;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font:700 40px var(--f);color:var(--carry);
  transition:transform .55s cubic-bezier(.5,-0.2,.4,1.2),font-size .55s;z-index:5}
.fly.dn{color:var(--kid);font-size:44px}

/* ---- ふきだし ---- */
#bubble{position:absolute;left:1084px;top:104px;width:496px;height:300px;background:#ebe7d8;border-radius:64px}
#bubble::after{content:"";position:absolute;left:84px;bottom:-60px;width:64px;height:66px;background:#ebe7d8;clip-path:polygon(0 0,100% 0,8% 100%)}
#say{position:absolute;left:40px;right:34px;top:30px;bottom:30px;font:700 40px/1.6 var(--fb);color:#222;display:flex;flex-direction:column;justify-content:center;overflow:hidden;word-break:auto-phrase;line-break:strict}
#say.btns{bottom:94px}
#say .ng{color:#e03131}
#say .sub{font-size:.8em;color:#444}
#say .ok{color:#1d8f43}
#say .num{color:#d6336c}
#sayBtns{position:absolute;right:30px;bottom:26px;display:flex;gap:12px}
#sayBtns .gb{width:236px;white-space:nowrap;font-size:23px;letter-spacing:0}

/* ---- キャラ ---- */
#charaW{position:absolute;left:1086px;top:476px;width:220px;height:220px;animation:bob 2.6s ease-in-out infinite}
#chara{width:100%;height:100%;transform:scaleX(-1);display:block}
#charaW.hop{animation:hop .55s ease}
#charaW.shake{animation:nope .5s ease}
#charaW.jump{animation:jump 1.1s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-34px)}}
@keyframes nope{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-70px) rotate(-10deg)}50%{transform:translateY(0)}70%{transform:translateY(-36px) rotate(8deg)}}

/* ---- テンキー ---- */
#pad{position:absolute;left:1300px;top:438px;width:280px;height:352px;display:grid;grid-template-columns:repeat(4,64px);grid-auto-rows:64px;gap:8px}
#pad .gb{width:auto;height:64px;font-size:34px;border-radius:16px;letter-spacing:0}
#pad .gb::before{left:9px;top:7px;width:7px;height:7px}
#pad .gb::after{left:14px;right:14px;top:5px;height:9px}
#pad .w2{grid-column:span 2}
#pad .w4{grid-column:span 4;font-size:30px}
#pad .gb.op{font-size:38px}
#pad[hidden]{display:none}

#endCard{position:absolute;left:1300px;top:438px;width:280px;height:352px;background:#fff;border:4px solid var(--navy);border-radius:26px;
  box-shadow:0 6px 0 var(--navy);display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:22px;padding:22px 20px;animation:pop .5s cubic-bezier(.2,1.5,.45,1)}
#endCard[hidden]{display:none}
#endCard .etxt{font:700 30px/1.45 var(--fb);text-align:center}
#endCard .gb{font-size:26px}

/* ---- アシスト ---- */
#assist{position:absolute;left:52px;width:1008px;height:316px;background:#fffef9;border:4px solid var(--navy);border-radius:26px;
  box-shadow:0 8px 0 rgba(36,49,77,.9),0 18px 40px rgba(0,0,0,.25);z-index:20;animation:up .35s cubic-bezier(.2,1.3,.45,1)}
#assist[hidden]{display:none}
@keyframes up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.ahead{position:absolute;left:0;right:0;top:0;height:70px;display:flex;align-items:center;gap:12px;padding:0 18px 0 26px;border-bottom:3px dashed #d6dbe4}
#aTitle{flex:1;font:700 30px var(--fb);color:var(--navy)}
#aTitle rt{font-size:.38em}
.ahead .gb{width:170px}
#aBody{position:absolute;left:0;right:0;top:72px;bottom:0}
#aBody svg{width:100%;height:100%}
.asv text{font-family:var(--fb);font-weight:700}
.st{opacity:0;animation:fin .5s ease-out forwards}
.dr{stroke-dasharray:300;stroke-dashoffset:300;animation:draw .6s ease-out forwards}
@keyframes fin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes draw{100%{stroke-dashoffset:0}}
.kuku{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;padding:16px 30px 0}
.kuku div{font:700 34px/58px var(--fb);text-align:center;border-radius:14px;background:#f1f4f9}
.kuku div.on{background:#ffe066;box-shadow:inset 0 0 0 3px #f59f00}
.knote{position:absolute;left:30px;right:30px;bottom:12px;font:700 24px var(--fb);color:#c2255c;text-align:center}
.kuku.n{padding-top:8px}
.kuku.n div{line-height:50px}

/* ---- モーダル ---- */
#modal{position:absolute;inset:0;background:rgba(20,30,50,.45);z-index:50;display:flex;align-items:center;justify-content:center}
#modal[hidden]{display:none}
.card{width:860px;background:#fff;border:4px solid var(--navy);border-radius:30px;box-shadow:0 8px 0 var(--navy);padding:34px 44px 38px;animation:pop .35s cubic-bezier(.2,1.4,.45,1)}
.card h2{font:700 40px var(--fb);text-align:center;margin-bottom:22px}
.card p{font:700 30px/1.6 var(--fb);text-align:center;margin-bottom:28px}
.card .row{display:flex;gap:20px;justify-content:center}
.card .row .gb{width:260px}
.opt{display:flex;align-items:center;gap:16px;margin:0 0 20px}
.opt .lbl{width:300px;font:700 28px var(--fb)}
.opt .seg{display:flex;gap:12px;flex:1}
.opt .seg .gb{flex:1;width:0;font-size:24px;height:60px}
.opt .seg .gb:not(.on){background:linear-gradient(180deg,#fff,#edf1f7 60%,#d9e1ec);color:var(--navy);text-shadow:none}
.opt .seg .gb:not(.on)::after{display:none}
.prev{display:inline-block;width:56px;height:56px;vertical-align:middle}
.credit{margin-top:6px;font:700 20px var(--fb);color:#6b7489;text-align:center}

/* ---- はなまる・紙ふぶき ---- */
.hana{fill:none;stroke:#e03131;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#confL{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.cf{position:absolute;top:-30px;width:16px;height:22px;border-radius:3px;animation:fall 2.2s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(1000px) rotate(720deg)}}
.ver{position:absolute;left:54px;bottom:6px;font:700 16px var(--fb);color:#9aa3b5}

/* ===== おたすけ計算 ===== */
.ttl:has(.badge){font-size:52px;top:14px}
.ttl .badge{display:inline-block;vertical-align:middle;margin-left:16px;padding:6px 18px 7px;border-radius:22px;background:linear-gradient(180deg,#ff9fc8,#ec5c9b);
  border:3px solid var(--navy);color:#fff;font-size:28px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 3px 0 var(--navy);position:relative;top:-6px}
.ttl .badge[hidden]{display:none}

#note{top:184px;height:672px}
#note>*{height:672px}
#figL{pointer-events:auto}
#boxL{z-index:4}

/* ---- 図の 切りかえ ---- */
#tabs{position:absolute;left:52px;top:110px;display:flex;gap:16px}
#tabs[hidden]{display:none}
#tabs .gb{width:230px}
#tabs .gb:not(.on){background:linear-gradient(180deg,#fff,#edf1f7 60%,#d9e1ec);color:var(--navy);text-shadow:none}
#tabs .gb:not(.on)::after{display:none}
#tabs .gb:not(.on)::before{background:#c9d3e2}
#tabs rt{font-size:.42em}

.mk.rd{color:#e03131}

/* ---- ブロック ---- */
.frm{position:absolute;border:3px solid #9aa5b8;border-radius:12px;background:rgba(255,255,255,.6)}
.frm.ten{border:4px solid #2f9e44;box-shadow:0 0 0 3px rgba(47,158,68,.18),0 0 16px rgba(47,158,68,.35);animation:tenOn .5s ease-out}
@keyframes tenOn{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.ftag{position:absolute;width:280px;text-align:center;font:700 26px var(--fb);color:#2b8a3e}
.ftag rt{font-size:.42em}
.bhl{position:absolute;width:50px;height:50px;border-radius:10px;background:rgba(255,226,0,.6);animation:swipe .4s ease-out both}
.blk{position:absolute;width:56px;height:56px}
.blk::before{content:"";position:absolute;left:5px;top:5px;width:46px;height:46px;border-radius:9px}
.blk.e::before{border:2.5px dashed #b8c2d1}
.blk.b::before{background:linear-gradient(180deg,#8fd0ff,#3a9bea 60%,#1f7fd0);border:3px solid #1864ab;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 3px 0 #1864ab}
.blk.p::before{background:linear-gradient(180deg,#ffc2dc,#f06595 60%,#d6336c);border:3px solid #a61e4d;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 3px 0 #a61e4d}
.blk.x::before{background:#e9ecef;border:3px solid #adb5bd}
.blk.x::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:4px;border-radius:2px;background:var(--borrow);transform:rotate(-50deg)}
.blk.can{cursor:pointer}
.blk.can::before{animation:canGlow 1.3s ease-in-out infinite}
@keyframes canGlow{0%,100%{outline:3px solid rgba(255,59,59,.25);outline-offset:2px}50%{outline:3px solid rgba(255,59,59,.85);outline-offset:4px}}
.blk.nw::before{animation:pop .45s cubic-bezier(.2,1.7,.45,1) both}

/* ---- 数の線 ---- */
.lsv{position:absolute;left:0;top:0;overflow:visible}
.lsv text{font-family:var(--fb);font-weight:700}
.lsv .tk{cursor:pointer}
.lsv .tk:hover + .tc{fill:rgba(255,59,59,.18)}
.tc{animation:tcG 1.3s ease-in-out infinite}
@keyframes tcG{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}

/* ---- テンキー（4だん） ---- */
#pad{top:470px;height:280px}
#endCard{top:470px;height:300px;gap:18px}
#endCard .etxt{font-size:30px}

/* ---- タイトル（モードを えらぶ） ---- */
#home{position:absolute;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 30%,#fffdf3,#f3efe0 75%)}
#home[hidden]{display:none}
.hTtl{position:absolute;left:0;right:0;top:36px;text-align:center;font:700 96px/1.3 var(--fb);letter-spacing:6px;color:#111}
.hTtl rt{font-size:.3em;letter-spacing:2px}
.hQ{position:absolute;left:0;right:0;top:212px;text-align:center;font:700 44px/1.4 var(--fb);color:var(--navy)}
.hQ rt{font-size:.4em}
.hBtns{position:absolute;left:330px;top:300px;width:940px;height:520px;display:grid;gap:24px;align-content:center}
.hBtns.c1{grid-template-columns:680px;justify-content:center}
.hBtns.c2{grid-template-columns:repeat(2,440px);justify-content:center}
.hBtns .gb{height:150px;border-radius:40px;flex-direction:column;gap:6px;font-size:44px;line-height:1.25}
.hBtns.c2 .gb{height:200px}
.hBtns.c3 .gb,.hBtns.c1.n3 .gb{height:136px}
.hBtns .gb small{display:block;font-size:24px;letter-spacing:0;opacity:.96}
.hBtns .gb rt{font-size:.4em}
.hBtns .gb::before{left:26px;top:16px;width:14px;height:14px}
.hBtns .gb::after{left:46px;right:46px;top:9px;height:18px}
#hBack{position:absolute;left:52px;bottom:52px;width:190px}
#hBack[hidden]{display:none}
.hChara{position:absolute;right:70px;bottom:70px;width:250px;height:250px;transform:scaleX(-1);animation:bobH 2.6s ease-in-out infinite}
@keyframes bobH{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-10px)}}
.hCredit{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:700 20px var(--fb);color:#8a93a6}
.hCredit rt{font-size:.45em}

/* ---- けっか ---- */
.score{font:700 120px/1 var(--fb);text-align:center;color:#e03131;margin:4px 0 6px}
.score small{font-size:44px;color:var(--ink);margin-left:6px}
.rsRow{display:flex;justify-content:center;gap:10px;margin:0 0 30px}
.rsRow span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 34px var(--fb);border:3px solid}
.rsRow .o{color:#e03131;border-color:#e03131;background:#fff5f5}
.rsRow .x{color:#868e96;border-color:#ced4da;background:#f8f9fa}
.card .row.r3 .gb{width:240px}
.card p rt,.card h2 rt{font-size:.4em}
#pad .w2{font-size:28px;white-space:nowrap}
.card .row.r3 .gb{font-size:25px;white-space:nowrap;letter-spacing:0}
.hBtns .gb .mt{display:block;white-space:nowrap}
.lband{fill:rgba(255,255,255,.88)}
.opt .seg .gb{white-space:nowrap;letter-spacing:0}
#flyL{pointer-events:none;z-index:6}
.fly.dn{color:var(--kid)}
</style>
</head>
<body>
<div id="stage">
  <header id="top">
    <h1 class="ttl">おたすけ<ruby>計算<rt>けいさん</rt></ruby><span class="badge" id="prog" hidden></span></h1>
    <div class="hbtns">
      <button class="gb g-cyan" id="bBack"><svg viewBox="0 0 32 32"><path d="M19 7 10 16l9 9" /></svg>もどす</button>
      <button class="gb g-green" id="bFwd">すすむ<svg viewBox="0 0 32 32"><path d="M13 7l9 9-9 9" /></svg></button>
      <button class="gb g-orange" id="bReset"><svg viewBox="0 0 32 32"><path d="M8 17a8 8 0 1 0 2.6-6" /><path d="M9 5v6h6" /></svg>リセット</button>
      <button class="gb g-navy" id="bSet"><svg viewBox="0 0 32 32" class="gear"><circle cx="16" cy="16" r="7.5" /><path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5M6.5 6.5l3.5 3.5M22 22l3.5 3.5M6.5 25.5 10 22M22 10l3.5-3.5" /></svg>せってい</button>
    </div>
  </header>

<script>
// ===== おたすけ計算：手順づくり（画面とは わける） =====
// 20までの たし算・ひき算。くりあがり・くりさがりは 1回まで。
(function (root) {
  'use strict';
  const COLS = 18, ROWS = 12, F = 3; // F＝式を かきはじめる 列
  const PL = '＋', MI = '−', EQ = '＝', OPS = { '+': PL, '-': MI };
  const OUT = 'この アプリでは 20までの {数|かず}で やろう';
  const KIND = { addS: 'add0', add10: 'add0', addT: 'add0', add1: 'add1', subS: 'sub0', subT: 'sub0', sub10: 'sub0', sub1: 'sub1' };

  // ---- 式の しゅるい ----
  function classify(a, op, b) {
    if (op === '+') {
      if (a <= 9 && b <= 9) return { ok: true, cls: a + b >= 11 ? 'add1' : 'addS' };
      if (a === 10 && b <= 9) return { ok: true, cls: 'add10' };
      if (a >= 11 && a <= 19 && b <= 9) return a % 10 + b <= 9 ? { ok: true, cls: 'addT' } : { ok: false, msg: OUT };
      if (a <= 9 && b >= 10 && b <= 19) return { ok: false, msg: '{大|おお}きい {数|かず}を {前|まえ}に して みよう' };
      return { ok: false, msg: OUT };
    }
    if (a > 19 || b > 19) return { ok: false, msg: OUT };
    if (b > a) return { ok: false, msg: `${a}から ${b}は ひけないよ` };
    if (a <= 10) return { ok: true, cls: 'subS' };
    if (b === 10) return { ok: true, cls: 'sub10' };
    if (b > 10) return { ok: false, msg: OUT };
    return { ok: true, cls: b > a % 10 ? 'sub1' : 'subT' };
  }
  function parse(f) {
    const m = /^(\d{1,2})([+\-])(\d{1,2})$/.exec(f);
    if (!m) return { ok: false, msg: '「{数|かず} ＋ {数|かず}」の かたちで {入|い}れてね' };
    const a = +m[1], op = m[2], b = +m[3], c = classify(a, op, b);
    if (!c.ok) return c;
    return { ok: true, a, op, b, cls: c.cls, kind: KIND[c.cls], ans: op === '+' ? a + b : a - b };
  }

  // ---- 挑戦モードの 問題（0は つかわない・答えも 1いじょう） ----
  function list(kind) {
    const out = [];
    for (const op of ['+', '-'])
      for (let a = 1; a <= 19; a++)
        for (let b = 1; b <= 19; b++) {
          const p = parse(`${a}${op}${b}`);
          if (p.ok && p.kind === kind && p.ans >= 1) out.push(p);
        }
    return out;
  }

  // ---- ノートに かく ----
  const mk = (r, c, t, k, o) => Object.assign({ id: `m${r}_${c}`, r, c, t: String(t), k: k || 'f' }, o || {});
  // 1行に ならべる（数は 1けたずつ 1マス）
  function row(r, toks, c0) {
    const marks = [], cols = [];
    let c = c0;
    toks.forEach(t => {
      const s = String(t), cc = [];
      for (const ch of s) { marks.push(mk(r, c, ch, 'f')); cc.push(c); c++; }
      cols.push(cc);
    });
    return { marks, cols, next: c };
  }
  // 赤い わく（数を 書く ところ）
  function inStep(r, c0, v, o) {
    const s = String(v), w = s.length;
    const add = [...s].map((ch, i) => mk(r, c0 + i, ch, 'd', { u: true }));
    return Object.assign({ type: 'in', box: { r, c: c0 + w - 1, w }, exp: v, max: w, add, cells: add.map(m => [r, m.c]) }, o || {});
  }
  // さくらんぼ（x0＝わける数の まんなか［マス］、rings＝下の まる）
  const sak = (x0, rings) => ({ id: 'sak', k: 'sak', r: 1, c: 0, x0, rings });
  const ten = (c) => [mk(2, c, '1', 'd', { cl: 'rd' }), mk(2, c + 1, '0', 'd', { cl: 'rd' })];
  const fill = (n, v) => { const a = Array(10).fill(''); for (let i = 0; i < n; i++) a[i] = v; return a; };
  const cat = (x, y) => x.concat(y).slice(0, 10).concat(Array(Math.max(0, 10 - x.length - y.length)).fill(''));

  // ---- 手順を つくる ----
  // S.split：'back'（後ろの数を わける）／'front'（前の数を わける）
  // S.sub：'kagen'（減加法）／'gengen'（減減法）
  // lv：'many'（たくさん）／'some'（すこし）／'none'（なし）
  function build(p, S, lv) {
    S = S || {}; lv = lv || 'many';
    const { a, op, b, ans, cls } = p;
    const fm = row(0, [a, OPS[op], b, EQ], F);
    const ca = fm.cols[0], cb = fm.cols[2];
    const P = { formula: `${a}${OPS[op]}${b}`, base: fm.marks, steps: [], fin: [], ans, cls,
      fig0: { A: fill(0), B: fill(0), mk: a }, assist: { type: 'sak', p: { a, op, b, ans, cls }, split: S.split || 'back', sub: S.sub || 'kagen' } };
    const fin = (say, o) => inStep(0, fm.next, ans, Object.assign({ say, final: true }, o || {}));
    P.ansBox = fin('').box;
    // さいごの 式の 答え＝式の 答え のときは、もう1回 書かせずに 式へ とばす
    const copyUp = () => {
      const l = steps[steps.length - 1], f = fin('');
      if (!l || l.type !== 'in' || l.exp !== ans) return steps.push(fin('こたえを {式|しき}に かこう', { hl: lastCells(steps) }));
      l.final = true; l.copy = { from: l.cells, to: f.cells }; l.add = l.add.concat(f.add);
    };
    const eq = (r, toks, v, say, o) => {
      const e = row(r, toks, F);
      return inStep(r, e.next, v, Object.assign({ say, pre: e.marks }, o || {}));
    };
    const H = cs => cs.map(c => [0, c]);
    const steps = P.steps;

    // すこし・なし：答えだけ
    if (lv !== 'many') {
      steps.push(fin('こたえは いくつ？<br>{赤|あか}い わくに かこう', { assist: P.assist, ask: lv === 'some', hl: H([...ca, ...cb]) }));
      return P;
    }
    const zero = a === 0 || b === 0;
    const u = a % 10;

    if (cls === 'add1') {
      if (S.split === 'front') {
        // 前の数を わける：3＋9 → 3を 2と 1、9＋1＝10、10＋2
        const need = 10 - b, rest = a - need, c = ca[0];
        P.fig0 = { A: fill(b, 'p'), B: fill(a, 'b'), mk: b };
        steps.push(inStep(2, c + 1, need, { say: `${b}は あと いくつで 10？`, pre: [sak(c + .5, [[c - 1, c - 1], [c + 1, c + 1]])], hl: H(cb), fhl: { A: 'empty', seg: [b, 10] }, wr: { k: 'to10', a: b } }));
        steps.push(inStep(2, c - 1, rest, { say: `${a}を ${need}と いくつに わける？`, hl: [[0, c], [2, c + 1]], wr: { k: 'split', n: a, k1: need } }));
        steps.push(move({ b: `${a}から ${need}こ うごかして、10を つくろう`, l: `${b}から ${need} すすむと？<br>{数|かず}の {線|せん}を タップ`, s: `${b}に ${need}を たすと 10だね` },
          { kind: 'move', from: 'B', color: 'b', n: need, line: [b, 10], lab: PL + need }, [[2, c + 1]]));
        steps.push(eq(4, [b, PL, need, EQ], 10, `${b}＋${need}は？`, { hl: [[0, ...cb], [2, c + 1]] }));
        steps.push(eq(5, [10, PL, rest, EQ], ans, `10と ${rest}で いくつ？`, { hl: [[2, c - 1]], arc: [10, ans, PL + rest] }));
      } else {
        // 後ろの数を わける：8＋5 → 5を 2と 3、8＋2＝10、10＋3
        const need = 10 - a, rest = b - need, c = cb[0];
        P.fig0 = { A: fill(a, 'b'), B: fill(b, 'p'), mk: a };
        steps.push(inStep(2, c - 1, need, { say: `${a}は あと いくつで 10？`, pre: [sak(c + .5, [[c - 1, c - 1], [c + 1, c + 1]])], hl: H(ca), fhl: { A: 'empty', seg: [a, 10] }, wr: { k: 'to10', a } }));
        steps.push(inStep(2, c + 1, rest, { say: `${b}を ${need}と いくつに わける？`, hl: [[0, c], [2, c - 1]], wr: { k: 'split', n: b, k1: need } }));
        steps.push(move({ b: `${b}から ${need}こ うごかして、10を つくろう`, l: `${a}から ${need} すすむと？<br>{数|かず}の {線|せん}を タップ`, s: `${a}に ${need}を たすと 10だね` },

    }

    if (zero) {
      // 0の けいさん（おたすけモードだけ）
      P.fig0 = a <= 10 ? { A: fill(a, 'b'), B: fill(op === '+' ? b : 0, 'p'), mk: a } : { A: fill(10, 'b'), B: fill(u, 'b'), mk: a };

      steps.push(move({ b: `10の ほうから ${b}こ とろう<br>ブロックを タップ`, l: `10から ${b} もどると？<br>{数|かず}の {線|せん}を タップ`, s: `10から ${b}を とろう` },

  const S = { split: 'back', sub: 'kagen', sound: true, view: 'blk' };
  // mode：'help'（問題おたすけ）／'chal'（問題挑戦）　lv：'many'／'some'／'none'
  const G = { mode: null, kind: null, lv: 'many', queue: [], qi: 0, score: 0, res: [] };
  const st = { phase: 'home', f: '', fmsg: null, prob: null, plan: null, idx: 0, inp: '', post: false, msg: null, timer: null, taps: {}, ct: [], rvFinal: false, scored: null };
  const cur = () => (st.plan && st.idx < st.plan.steps.length ? st.plan.steps[st.idx] : null);
  const SYM = { '+': '＋', '-': '−' };
  const KINDS = [
    ['add0', 'くりあがり なし', 'たし{算|ざん}', 'g-cyan'], ['add1', 'くりあがり あり', 'たし{算|ざん}', 'g-orange'],
    ['sub0', 'くりさがり なし', 'ひき{算|ざん}', 'g-green'], ['sub1', 'くりさがり あり', 'ひき{算|ざん}', 'g-pink']];
  const LVS = [['many', 'たくさん', 'ブロックや さくらんぼで いっしょに', 'g-orange'], ['some', 'すこし', 'こまったら アシストを みる', 'g-cyan'], ['none', 'なし', 'じぶんの ちからで ちょうせん', 'g-navy']];

  // ---- ステージを 画面に あわせる ----
  function fit() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  window.addEventListener('resize', fit);

  // ---- 5mm方眼ノート ----
  function drawGrid() {
    const W = K.COLS * C, Hh = K.ROWS * C, h = C / 2;
    let s = `<rect x="0" y="0" width="${W}" height="${Hh}" fill="#fff"/>`;
    for (let x = h; x < W; x += C) s += `<line x1="${x}" y1="0" x2="${x}" y2="${Hh}" stroke="#9fd3ea" stroke-width="1" stroke-dasharray="2 3"/>`;
    for (let y = h; y < Hh; y += C) s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#9fd3ea" stroke-width="1" stroke-dasharray="2 3"/>`;
    for (let x = C; x < W; x += C) s += `<line x1="${x}" y1="0" x2="${x}" y2="${Hh}" stroke="#4aaad6" stroke-width="1.6"/>`;
    for (let y = C; y < Hh; y += C) s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#4aaad6" stroke-width="1.6"/>`;
    s += `<line x1="${C}" y1="0" x2="${C}" y2="${C}" stroke="#2b8fc4" stroke-width="2.4"/>`;
    s += `<rect x="0" y="0" width="${W}" height="${Hh}" fill="none" stroke="#2b8fc4" stroke-width="3.5"/>`;
    const t = (x, y, v, a) => `<text x="${x}" y="${y}" font-size="13" fill="#2b8fc4" text-anchor="${a || 'middle'}" font-family="sans-serif">${v}</text>`;
    for (let u = 5; u * h < W; u += 5) { s += t(u * h, -5, u); s += t(u * h, Hh + 16, u); }
    for (let u = 5; u * h < Hh; u += 5) { s += t(-9, u * h + 4, u); s += t(W + 9, u * h + 4, u); }
    $('grid').innerHTML = s;
  }

  // ---- 印の じょうたい ----
  function ap(m, add) { (add || []).forEach(x => m.set(x.id, x)); }
  function marksAt(idx, withPre) {
    const m = new Map(), P = st.plan, ss = P.steps;
    ap(m, P.base);
    for (let k = 0; k < idx && k < ss.length; k++) { ap(m, ss[k].pre); ap(m, ss[k].add); }
    if (withPre && idx < ss.length) ap(m, ss[idx].pre);
    return m;
  }
  const solving = () => st.phase === 'solve' || st.phase === 'done';

  // ---- かく ----
  function render(o) {
    o = o || {};
    const nw = o.nw || new Set(), late = o.late || new Set();
    const marks = solving() ? marksAt(st.idx, !st.post) : new Map();
    let h = '', lines = '';
    for (const m of marks.values()) {
      if (m.k === 'sak') { lines += sakSvg(m, nw.has(m.id)); continue; }
      const cls = 'mk ' + m.k + (m.u ? ' u' : '') + (m.cl ? ' ' + m.cl : '') + (nw.has(m.id) ? ' nw' : '') + (late.has(m.id) ? ' late' : '');
      h += `<div class="${cls}" style="left:${m.c * C}px;top:${m.r * C}px">${m.t}</div>`;
    }
    $('markL').innerHTML = h;
    $('lineL').innerHTML = lines;
    // 蛍光ペン（よこに ならんだ マスは 1本に）
    let hh = '';
    const s = cur();
    if (st.phase === 'solve' && s && !st.post) {
      const cells = (s.hl || []).slice().sort((p, q) => p[0] - q[0] || p[1] - q[1]);
      const runs = [];
      cells.forEach(([r, c]) => { const l = runs[runs.length - 1]; if (l && l.r === r && l.c2 === c - 1) l.c2 = c; else if (!(l && l.r === r && l.c2 >= c)) runs.push({ r, c1: c, c2: c }); });
      runs.forEach((u, i) => { hh += `<div class="hl" style="left:${u.c1 * C + 3}px;top:${u.r * C + 5}px;width:${(u.c2 - u.c1 + 1) * C - 6}px;height:${C - 10}px;animation-delay:${i * 0.08}s"></div>`; });
    }
    $('hlL').innerHTML = hh;
    renderBox();
    renderFig(o);
    renderSay();
    renderBtns();
    renderTop();
  }
  // さくらんぼ（くき＝黒、まる＝赤）
  function sakSvg(m, isNew) {
    const x0 = m.x0 * C, y0 = C + 6, cls = isNew ? ' class="dr"' : '';
    let s = '';
    m.rings.forEach(([c1, c2], i) => {
      const cx = (c1 + c2 + 1) / 2 * C, rx = (c2 - c1 + 1) * C / 2 + 1, ry = C / 2 - 2, cy = 2.5 * C;
      s += `<line${cls} style="animation-delay:${i * .12}s" x1="${x0}" y1="${y0}" x2="${cx}" y2="${cy - ry}" stroke="#1c2233" stroke-width="3" stroke-linecap="round"/>`;
      s += `<ellipse${isNew ? ' class="pp"' : ''} cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#e03131" stroke-width="3.2"/>`;
    });
    return s;
  }

  function boxInfo() {
    if (st.phase === 'formula') return { r: 0, c: K.F + 7, w: 8, f: true };
    const s = cur();
    if (st.phase !== 'solve' || !s || st.post || s.type !== 'in') return null;
    return s.box;
  }
  function renderBox(shake) {
    const b = boxInfo(), L = $('boxL');
    if (!b) { L.innerHTML = ''; return; }
    const left = (b.c - b.w + 1) * C, top = b.r * C;
    let inner = '';
    if (b.f) {
      [...st.f].forEach((ch, i) => { inner += `<div class="bd f" style="left:${i * C}px">${SYM[ch] || ch}</div>`; });
      if (st.f.length < b.w) inner += `<div class="caret" style="left:${st.f.length * C + 12}px"></div>`;
    } else {
      const t = st.inp;
      [...t].forEach((ch, i) => { inner += `<div class="bd" style="left:${(b.w - t.length + i) * C}px">${ch}</div>`; });
      if (!t) inner += `<div class="caret" style="left:${(b.w - 1) * C + 12}px"></div>`;
    }
    L.innerHTML = `<div class="box${shake ? ' shake' : ''}" style="left:${left - 4}px;top:${top - 4}px;width:${b.w * C + 8}px;height:${C + 8}px">${inner}</div>`;
  }

  // ---- 図（ブロック・数の線） ----
  const FR = { A: 3, B: 10 }, FROW = 8;
  function eligible(f, mv) { const L = f[mv.from]; return L.map((v, i) => i).filter(i => mv.kind === 'move' ? L[i] === mv.color : (L[i] === 'b' || L[i] === 'p')); }
  function applyMv(f, mv, taps) {
    let list = taps;
    if (!list) { const el = eligible(f, mv); list = mv.all ? el : el.slice(-mv.n); }
    const moved = [];
    for (const i of list) {
      if (mv.kind === 'move') { const v = f[mv.from][i]; f[mv.from][i] = ''; const e = f.A.indexOf(''); f.A[e] = v; moved.push(e); }
      else f[mv.from][i] = 'x';
    }
    return moved;
  }
  // k番目の 手順の ときの 図
  function figAt(k, withCur) {
    const P = st.plan, f = { A: P.fig0.A.slice(), B: P.fig0.B.slice(), arcs: [], mk: P.fig0.mk, nwA: [] };
    for (let j = 0; j < k && j < P.steps.length; j++) {
      const s = P.steps[j];
      if (s.mv) { applyMv(f, s.mv, st.taps[j]); f.arcs.push([s.mv.line[0], s.mv.line[1], s.mv.lab]); }
      if (s.arc) f.arcs.push(s.arc);
    }
    if (withCur && st.ct.length) f.nwA = applyMv(f, P.steps[k].mv, st.ct);
    if (st.phase === 'done' && P.steps.length) { const l = P.steps[P.steps.length - 1]; if (l.arc && !f.arcs.includes(l.arc)) f.arcs.push(l.arc); }
    if (f.arcs.length) f.mk = f.arcs[f.arcs.length - 1][1];
    return f;
  }
  function renderFig(o) {
    o = o || {};
    const show = solving() && G.lv === 'many';
    $('tabs').hidden = !show;
    document.querySelectorAll('#tabs .gb').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
    const L = $('figL');
    if (!show || S.view === 'sak') { L.innerHTML = ''; return; }
    const s = cur(), act = st.phase === 'solve' && s && !st.post;
    const mv = act && s.type === 'move' ? s.mv : null;
    const f = figAt(st.idx, !!mv);
    const fhl = act ? (s.fhl || {}) : {};
    L.innerHTML = S.view === 'blk' ? blkHtml(f, fhl, mv, o.tapNew) : lineHtml(f, fhl, mv, o.arcNew);
  }
  function blkHtml(f, hl, mv, tapNew) {
    let h = '';
    ['A', 'B'].forEach(k => {
      const full = k === 'A' && f.A.every(v => v === 'b' || v === 'p');
      h += `<div class="frm${full ? ' ten' : ''}" style="left:${FR[k] * C - 6}px;top:${FROW * C - 6}px;width:${5 * C + 12}px;height:${2 * C + 12}px"></div>`;
      if (full) h += `<div class="ftag" style="left:${FR[k] * C}px;top:${(FROW + 2) * C + 10}px">10の まとまり</div>`;
      const el = mv && mv.from === k ? new Set(eligible(f, mv)) : null;
      f[k].forEach((v, i) => {
        const x = (FR[k] + i % 5) * C, y = (FROW + Math.floor(i / 5)) * C, w = hl[k];
        const hi = w && ((w === 'empty' && v === '') || (w === 'all' && (v === 'b' || v === 'p')) || w === v);
        if (hi) h += `<div class="bhl" style="left:${x + 3}px;top:${y + 3}px"></div>`;
        const nw = k === 'A' && tapNew && f.nwA.includes(i);
        h += `<div class="blk ${v || 'e'}${el && el.has(i) ? ' can' : ''}${nw ? ' nw' : ''}" data-f="${k}" data-i="${i}" style="left:${x}px;top:${y}px"></div>`;
      });
    });
    return h;
  }
  const LX = v => 56 + v * 44.8, LY = 9.5 * C;
  function lineHtml(f, hl, mv, arcNew) {
    const INK = '#1c2233';
    let s = `<svg class="lsv" width="1008" height="672"><defs><marker id="la" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${INK}"/></marker></defs>`;
    s += `<rect class="lband" x="2" y="${7 * C + 2}" width="${K.COLS * C - 4}" height="${4 * C - 4}"/>`;
    if (hl.seg) { const [x, y] = hl.seg; s += `<rect x="${LX(Math.min(x, y)) - 6}" y="${LY - 18}" width="${Math.abs(y - x) * 44.8 + 12}" height="36" rx="10" fill="rgba(255,226,0,.6)"/>`; }
    s += `<line x1="${LX(0) - 24}" y1="${LY}" x2="${LX(20) + 24}" y2="${LY}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
    for (let v = 0; v <= 20; v++) {
      const big = v % 10 === 0, mid = v % 5 === 0, len = big ? 22 : mid ? 16 : 10, col = v === 10 ? '#2b8a3e' : INK;
      s += `<line x1="${LX(v)}" y1="${LY - len}" x2="${LX(v)}" y2="${LY + len}" stroke="${col}" stroke-width="${big ? 4 : 2.5}"/>`;
      s += `<text x="${LX(v)}" y="${LY + 56}" font-size="${v === 10 ? 30 : 26}" text-anchor="middle" fill="${col}">${v}</text>`;
    }
    f.arcs.forEach(([a, b, lab], i) => {
      const x1 = LX(a), x2 = LX(b), hgt = Math.min(130, 40 + Math.abs(b - a) * 9), y = LY - 10, mx = (x1 + x2) / 2;
      const nw = arcNew && i === f.arcs.length - 1;
      s += `<path${nw ? ' class="dr"' : ''} d="M${x1} ${y} Q${mx} ${y - hgt * 2} ${x2 + (b > a ? -3 : 3)} ${y - 2}" fill="none" stroke="${INK}" stroke-width="3.5" marker-end="url(#la)" pathLength="300"/>`;
      s += `<text${nw ? ' class="st"' : ''} x="${mx}" y="${y - hgt - 12}" font-size="30" text-anchor="middle" fill="${INK}">${lab}</text>`;
    });
    s += `<circle cx="${LX(f.mk)}" cy="${LY}" r="12" fill="#183a8c" stroke="#fff" stroke-width="3"/>`;
    if (mv) for (let v = 0; v <= 20; v++) s += `<rect class="tk" data-v="${v}" x="${LX(v) - 22}" y="${LY - 60}" width="44" height="130" fill="transparent"/><circle class="tc" cx="${LX(v)}" cy="${LY}" r="19" fill="transparent" stroke="#ff3b3b" stroke-width="3" stroke-dasharray="5 4" pointer-events="none"/>`;
    return s + '</svg>';
  }
  $('figL').addEventListener('click', e => {
    const s = cur();
    if (st.phase !== 'solve' || !s || s.type !== 'move' || st.post || !$('modal').hidden) return;
    if (S.view === 'blk') {
      const b = e.target.closest('.blk'); if (!b) return;
      if (!b.classList.contains('can')) { se('ng'); shakeChara(); return; }
      const f = figAt(st.idx, true);
      if (s.mv.all) st.ct = eligible(f, s.mv); else st.ct.push(+b.dataset.i);
      se('tap');
      if (s.mv.all || st.ct.length >= s.mv.n) correct(s, false);
      else { renderFig({ tapNew: true }); renderSay(); }
    } else if (S.view === 'line') {
      const t = e.target.closest('[data-v]'); if (!t) return;
      if (+t.dataset.v === s.mv.line[1]) correct(s, false); else wrong(s, +t.dataset.v);
    }
  });
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.v === S.view) return;
    se('btn'); S.view = b.dataset.v; st.ct = []; st.msg = null; render();
  });

  // ---- ふきだし ----
  function stepSay(s) {
    if (s.type !== 'move') return s.say;
    let t = s.say[S.view === 'blk' ? 'b' : S.view === 'line' ? 'l' : 's'];
    if (S.view === 'blk' && st.ct.length && !s.mv.all) t += `<div class="sub">${st.ct.length}こ ${s.mv.kind === 'move' ? 'うごかしたよ' : 'とったよ'}</div>`;
    return t;
  }
  function renderSay() {
    const el = $('say'), bt = $('sayBtns');
    let html = '', btns = '';
    const s = cur();
    if (st.phase === 'formula') {
      html = st.fmsg ? `<div class="ng">${rb(st.fmsg)}</div>` : rb('{赤|あか}い わくに {式|しき}を {入|い}れよう<div class="sub">れい：8＋5、13−9</div>');
      if (!st.fmsg && st.f) html = rb('{入|い}れたら<br>「けってい」を おそう');
    } else if (st.phase === 'done') {
      html = `<div class="ok">${rb(st.msg || '')}</div>`;
    } else if (st.post) {
      html = `<div class="ok">${rb(st.msg || 'せいかい！')}</div>`;
    } else if (s) {
      const t = stepSay(s);
      html = st.msg ? `<div class="ng">${rb(st.msg)}</div><div class="sub">${rb(t)}</div>` : rb(t);
      if (s.type === 'move' && S.view === 'sak') btns += `<button class="gb g-green sm" data-act="next">つぎへ<svg viewBox="0 0 32 32"><path d="M13 7l9 9-9 9"/></svg></button>`;
      if (s.assist && (s.ask || st.msg)) btns += `<button class="gb g-pink sm" data-act="assist">アシストを みる？</button>`;
    }
    bt.innerHTML = btns;
    el.classList.toggle('btns', !!btns);
    el.innerHTML = `<div>${html}</div>`;
    let fs = 40; el.style.fontSize = fs + 'px';
    while ((el.scrollHeight > el.clientHeight + 1) && fs > 20) { fs -= 2; el.style.fontSize = fs + 'px'; }
  }
  $('sayBtns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'next') nextMoveInfo();
    if (b.dataset.act === 'assist') { const s = cur(); if (s && s.assist) openAssist(s.assist); }
  });

  function renderBtns() {
    const s = cur();
    $('bBack').disabled = st.phase === 'formula' || (G.mode === 'chal' && st.phase === 'solve' && st.idx === 0 && !st.post);
    $('bFwd').disabled = st.phase === 'done' || (st.phase === 'formula' && !st.f);
    $('bReset').disabled = st.phase === 'formula' && !st.f;
    const opOn = st.phase === 'formula';
    const numOn = opOn || (st.phase === 'solve' && !st.post && s && s.type === 'in');
    document.querySelectorAll('#pad .gb').forEach(b => {
      const k = b.dataset.k;
      if (k === '+' || k === '-') b.disabled = !opOn;
      else if (k === 'OK') b.disabled = !(opOn || (st.phase === 'solve' && !st.post && s && (s.type === 'in' || (s.type === 'move' && S.view === 'sak'))));
      else b.disabled = !numOn;
    });
  }
  function renderTop() {
    const p = $('prog');
    p.hidden = !(G.mode === 'chal' && solving());
    p.textContent = `${Math.min(G.qi + 1, 10)}／10もん`;
  }

  // ---- テンキー ----
  function buildPad() {
    const P = [['7'], ['8'], ['9'], ['+', '＋', 'op g-orange'], ['4'], ['5'], ['6'], ['-', '−', 'op g-orange'],
      ['1'], ['2'], ['3'], ['0'], ['BS', '⌫', 'w2 g-gray'], ['OK', 'けってい', 'w2 g-green']];
    $('pad').innerHTML = P.map(([k, t, c]) => `<button class="gb ${c && c.includes('g-') ? '' : 'g-pearl'} ${c || ''}" data-k="${k}">${t || k}</button>`).join('');
    $('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) key(b.dataset.k); });
  }

  // ---- 入力 ----
  function key(k) {
    if (!$('modal').hidden || !$('home').hidden) return;
    if (st.phase === 'formula') {
      if (/^\d$/.test(k) || k === '+' || k === '-') addF(k);
      else if (k === 'BS') { st.f = st.f.slice(0, -1); st.fmsg = null; se('tap'); render(); }
      else if (k === 'OK') confirmFormula();
      return;
    }
    if (st.phase !== 'solve' || st.post) return;
    const s = cur(); if (!s) return;
    if (s.type === 'move') { if (k === 'OK' && S.view === 'sak') nextMoveInfo(); return; }
    if (s.type !== 'in') return;
    if (/^\d$/.test(k)) {
      if (st.inp.length >= s.max) { renderBox(true); return; }
      st.inp += k; se('tap'); renderBox();
    } else if (k === 'BS') { st.inp = st.inp.slice(0, -1); se('tap'); renderBox(); }
    else if (k === 'OK') check();
  }
  function addF(k) {
    let [, a, op, b] = /^(\d*)([+\-]?)(\d*)$/.exec(st.f);
    st.fmsg = null;
    if (k === '+' || k === '-') {
      if (!a) { st.fmsg = 'さきに {数|かず}を {入|い}れてね'; return fail(); }
      if (op && b) { st.fmsg = 'きごうは 1つだけだよ'; return fail(); }
      op = k;
    } else if (!op) {
      if (a.length >= 2) { st.fmsg = '{数|かず}は 2けたまでだよ'; return fail(); }
      a = a === '0' ? k : a + k;
    } else {
      if (b.length >= 2) { st.fmsg = '{数|かず}は 2けたまでだよ'; return fail(); }
      b = b === '0' ? k : b + k;
    }
    st.f = a + op + b; se('tap'); render();
  }
  function fail() { se('ng'); render(); renderBox(true); shakeChara(); }

  function confirmFormula() {
    const p = K.parse(st.f);
    if (!p.ok) { st.fmsg = p.msg; return fail(); }
    startPlan(p);
  }
  function startPlan(p) {
    clearTimeout(st.timer); st.timer = null; closeAssist(); hideEnd(); $('fxL').innerHTML = '';
    Object.assign(st, { prob: p, plan: K.build(p, S, G.lv), phase: 'solve', idx: 0, inp: '', msg: null, post: false, fmsg: null, f: '', taps: {}, ct: [], scored: null });
    se('pop');
    const nw = new Set(st.plan.base.map(m => m.id)); (cur().pre || []).forEach(m => nw.add(m.id));
    render({ nw });
  }

  function check() {
    const s = cur();
    if (!s || s.type !== 'in' || st.post) return;
    if (st.inp === '') { renderBox(true); return; }
    if (+st.inp === s.exp) correct(s, false); else wrong(s, +st.inp);
  }
  function correct(s, revealed) {
    se('ok'); hopChara(); closeAssist();
    if (s.type === 'move') { st.taps[st.idx] = (revealed || S.view !== 'blk') ? null : st.ct.slice(); st.ct = []; }
    if (s.final && revealed) st.rvFinal = true;
    st.post = true;
    st.msg = revealed ? (s.type === 'in' ? `こたえは ${s.exp}だよ` : 'こう なるよ') : pick(['せいかい！', 'いいね！', 'そのとおり！', 'ばっちり！']);
    if (!revealed && s.type === 'move' && s.mv.line[1] === 10 && s.mv.kind === 'move') st.msg = '10が できたね！';
    // さいごの 式の 答えを、上の 式へ とばす（2回 書かせない）
    const late = new Set();

  const RED = '#e03131', GRN = '#2b8a3e', INK = '#1c2233', BLU = '#1971c2';
  const T = (x, y, s, o) => `<text x="${x}" y="${y}" font-size="${(o && o.fs) || 40}" text-anchor="${(o && o.a) || 'start'}" fill="${(o && o.c) || INK}">${s}</text>`;
  const gd = (d, inner) => `<g class="st" style="animation-delay:${d}s">${inner}</g>`;
  const R_ = v => `<tspan fill="${RED}">${v}</tspan>`, G_ = v => `<tspan fill="${GRN}">${v}</tspan>`;
  const svgW = s => `<svg class="asv" viewBox="0 0 1000 236">${s}</svg>`;
  const lines = (arr) => arr.map((t, i) => gd(.7 + i * 1.1, T(470, [56, 108, 160, 212][i], t, { fs: 38 }))).join('');
  // 式と さくらんぼ（si＝わける数の ばしょ、gi＝10を つくる ほう）
  function cherry(toks, si, L, Rv, gi) {
    const X = [100, 200, 300];
    let s = toks.map((t, i) => T(X[i], 98, t, { fs: 76, a: 'middle' })).join('');
    const sx = X[si], cL = sx - 56, cR = sx + 56;
    const circ = (cx, v, col, d) => gd(d, `<circle cx="${cx}" cy="190" r="36" fill="${col === GRN ? '#d3f9d8' : '#ffe3e3'}" stroke="${col}" stroke-width="4"/>` + T(cx, 204, v, { a: 'middle', c: col, fs: 40 }));
    const ln = (x2, d) => `<line class="dr" style="animation-delay:${d}s" x1="${sx}" y1="112" x2="${x2}" y2="158" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
    s += ln(cL, .3) + ln(cR, .3) + circ(cL, L, RED, .7) + circ(cR, Rv, RED, .7);
    if (gi != null) s += circ(gi === 0 ? cL : cR, gi === 0 ? L : Rv, GRN, 1.8);
    return s;
  }
  function blocksSvg(nb, np, nx) {
    // nb＝青、np＝ピンク、nx＝とる（うしろから）
    let s = '';
    const tot = nb + np;
    for (let i = 0; i < Math.max(10, tot); i++) {
      const x = 40 + (i % 5) * 64 + (i >= 10 ? 0 : 0), y = 40 + Math.floor((i % 10) / 5) * 64 + (i >= 10 ? 140 : 0);
      if (i >= tot && i >= 10) continue;
      const v = i < nb ? 'b' : i < tot ? 'p' : '';
      const taken = v && i >= tot - nx;
      const fill = !v ? 'none' : taken ? '#e9ecef' : v === 'b' ? '#4dabf7' : '#f783ac', st2 = !v ? '#b8c2d1' : taken ? '#adb5bd' : v === 'b' ? '#1864ab' : '#a61e4d';
      s += gd(.05 * i, `<rect x="${x}" y="${y}" width="54" height="54" rx="9" fill="${fill}" stroke="${st2}" stroke-width="3"${!v ? ' stroke-dasharray="6 5"' : ''}/>`);
      if (taken) s += gd(1 + .08 * (i - tot + nx), `<line x1="${x + 10}" y1="${y + 44}" x2="${x + 44}" y2="${y + 10}" stroke="${BLU}" stroke-width="5" stroke-linecap="round"/>`);
    }
    return s;
  }
  function assistView(a) {
    const p = a.p, x = p.a, y = p.b, ans = p.ans, u = x % 10, PL = '＋', MI = '−';
    let s = '', title = 'さくらんぼ けいさん';
    switch (p.cls) {
      case 'add1':
        if (a.split === 'front') { const need = 10 - y, rest = x - need; s = cherry([x, PL, y], 0, rest, need, 1) + lines([`${x}を ${R_(need)}と ${R_(rest)}に わける`, `${y}＋${G_(need)}＝${G_(10)}`, `${G_(10)}＋${R_(rest)}＝${ans}`]); }

        else { s = cherry([x, MI, y], 0, 10, u, 0) + lines([`${x}を ${G_(10)}と ${R_(u)}に わける`, `${G_(10)}−${y}＝${10 - y}`, `${10 - y}＋${R_(u)}＝${ans}`]); }
        title = 'さくらんぼ けいさん（10から ひこう）'; break;
      case 'addT': s = cherry([x, PL, y], 0, 10, u, 0) + lines([`${x}を ${G_(10)}と ${R_(u)}に わける`, `${R_(u)}＋${y}＝${u + y}`, `${G_(10)}＋${u + y}＝${ans}`]); title = '10と ばらに わけよう'; break;
      case 'subT': s = cherry([x, MI, y], 0, 10, u, 0) + lines([`${x}を ${G_(10)}と ${R_(u)}に わける`, `${R_(u)}−${y}＝${u - y}`, `${G_(10)}＋${u - y}＝${ans}`]); title = '10と ばらに わけよう'; break;
      case 'sub10': s = cherry([x, MI, y], 0, 10, u, 0) + lines([`${x}を ${G_(10)}と ${R_(u)}に わける`, `${G_(10)}を とると…`, `${R_(u)}が のこるね`]); title = '10と ばらに わけよう'; break;
      case 'add10': s = blocksSvg(10, 0, 0) + lines([`${G_('10の まとまり')}と`, `ばらが ${y}こ`, 'あわせて いくつかな？']); title = '10と ばら'; break;
      case 'addS': s = blocksSvg(x, y, 0) + lines([`${x}こと ${y}こを`, 'あわせると…', 'ぜんぶ かぞえて みよう']); title = 'ブロックで かんがえよう'; break;
      default: s = blocksSvg(Math.min(x, 10), 0, Math.min(y, 10)) + lines([`${x}こから ${y}こ とると…`, 'のこりを', 'かぞえて みよう']); title = 'ブロックで かんがえよう';
    }
    return { title, body: svgW(s) };
  }

  // ---- うごき ----
  function fly(from, to, t) {

  function hanamaru() {
    const b = st.plan.ansBox;

  function confetti() {

    }
  }

  // ---- キーボード ----
  document.addEventListener('keydown', e => {
    if (!$('modal').hidden) { if (e.key === 'Escape' && !mLock) closeModal(); return; }
    if (e.key === 'Escape') { closeAssist(); return; }
    let k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key;
    else if (e.key === '+') k = '+';
    else if (e.key === '-') k = '-';
    else if (e.key === 'Backspace' || e.key === 'Delete') k = 'BS';
    else if (e.key === 'Enter' || e.key === '=') k = 'OK';
    if (k) { e.preventDefault(); key(k); }
  });

  // ---- はじめ ----
  window.__otasuke = { st, S, G, key, fwd, back, cur, showHome };
  drawGrid(); buildPad(); fit(); showHome('mode');
  const v = document.createElement('div'); v.className = 'ver'; v.textContent = 'ver ' + VER; $('stage').appendChild(v);
})();
</script>
</body>
</html>
