<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おたすけ計算</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header id="top">
    <h1 class="ttl">おたすけ<ruby>計算<rt>けいさん</rt></ruby><span class="badge" id="prog" hidden></span></h1>
    <div class="hbtns">
      <button class="gb g-cyan" id="bBack"><svg viewBox="0 0 32 32"><path d="M19 7 10 16l9 9" /></svg>もどす</button>
      <button class="gb g-green" id="bFwd">すすむ<svg viewBox="0 0 32 32"><path d="M13 7l9 9-9 9" /></svg></button>
      <button class="gb g-orange" id="bReset"><svg viewBox="0 0 32 32"><path d="M8 17a8 8 0 1 0 2.6-6" /><path d="M9 5v6h6" /></svg>リセット</button>
      <button class="gb g-navy" id="bSet"><svg viewBox="0 0 32 32" class="gear"><circle cx="16" cy="16" r="7.5" /><path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5M6.5 6.5l3.5 3.5M22 22l3.5 3.5M6.5 25.5 10 22M22 10l3.5-3.5" /></svg>せってい</button>
    </div>
  </header>

  <div id="tabs" hidden>
    <button class="gb g-cyan sm" data-v="blk">ブロック</button>
    <button class="gb g-cyan sm" data-v="line"><ruby>数<rt>かず</rt></ruby>の<ruby>線<rt>せん</rt></ruby></button>
    <button class="gb g-cyan sm" data-v="sak">さくらんぼ</button>
  </div>

  <div id="note">
    <svg id="grid"></svg>
    <div id="shiki"><ruby>式<rt>しき</rt></ruby></div>
    <div id="hlL"></div>
    <svg id="lineL"></svg>
    <div id="markL"></div>
    <div id="figL"></div>
    <div id="boxL"></div>
    <svg id="fxL"></svg>
  </div>

  <div id="bubble"><div id="say"></div><div id="sayBtns"></div></div>
  <div id="charaW"><img id="chara" src="assets/chara.png" alt=""></div>
  <div id="pad"></div>
  <div id="endCard" hidden>
    <div class="etxt" id="eTxt"></div>
    <button class="gb g-green" id="bNew"></button>
    <button class="gb g-gray" id="bStay">このまま みる</button>
  </div>

  <div id="assist" hidden>
    <div class="ahead">
      <div id="aTitle"></div>
      <button class="gb g-cyan sm" id="aAgain">もういちど</button>
      <button class="gb g-gray sm" id="aClose">とじる</button>
    </div>
    <div id="aBody"></div>
  </div>

  <div id="home">
    <div class="hTtl">おたすけ<ruby>計算<rt>けいさん</rt></ruby></div>
    <div class="hQ" id="hQ"></div>
    <div class="hBtns" id="hBtns"></div>
    <button class="gb g-gray" id="hBack"><svg viewBox="0 0 32 32"><path d="M19 7 10 16l9 9" /></svg>もどる</button>
    <img class="hChara" src="assets/chara.png" alt="">
    <div class="hCredit">つくった<ruby>人<rt>ひと</rt></ruby>：のち（まなび堂）</div>
  </div>

  <div id="modal" hidden><div class="card" id="mCard"></div></div>
  <div id="confL"></div>
</div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
